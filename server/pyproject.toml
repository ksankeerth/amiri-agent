[project]
name = "amiri-server"
version = "0.1.0"
description = "Amiri Agent server: the web app's API, the work tick, and the code components."
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.8,<3.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "pycountry>=26.2.16",
    "tzdata>=2026.5",
    "google-auth>=2.61.0",
    "holidays>=0.106",
    "requests>=2.34.2",
]

[project.scripts]
amiri = "app.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "ruff>=0.4.6,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "C901", "B006", "B008"]

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
