openapi: 3.1.0
info:
  title: amiri-server
  description: "Amiri Agent server API: the platform core behind the web app. Code\
    \ only, no model: it enumerates,\nscores, schedules and stores, and every number\
    \ a person reads comes from here.\n\n- **Institution profile** (bank or insurer):\
    \ footprint, customer groups, products, money flows,\n  regulators, rivals, counterparties\
    \ and risks, with suggestions, readiness and history.\n- **Watch:** market series\
    \ (Twelve Data), monitors (checked by the monitor agent) and Radar (world news).\n\
    - **Findings and investigations:** findings are grouped into events and traced\
    \ to products by the\n  investigation agent; **alerts** go to each owning team;\
    \ **validation** checks the expected effects\n  against the institution's own\
    \ figures (the Metrics Spec API).\n- **Scenario Studio**, the **setup agent**\
    \ chat, the **Metrics Spec**, reference data and the prototype's\n  sample institutions.\n\
    \nErrors are RFC 9457 problem details. Roles are applied in the web app, not here\
    \ (prototype).\n"
  version: 0.1.0
paths:
  /api/v1/auth/config:
    get:
      tags:
      - bot check
      summary: Whether a bot check is on (and its site key), and whether the server
        is asleep (public)
      operationId: config_api_v1_auth_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/me:
    get:
      tags:
      - bot check
      summary: Whether this browser has passed the bot check (public)
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/prototype:
    post:
      tags:
      - bot check
      summary: 'The bot check: verify the reCAPTCHA token, then set the cookie'
      operationId: prototype_api_v1_auth_prototype_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrototypeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - bot check
      summary: Forget the passed check (clears the cookie)
      operationId: logout_api_v1_auth_logout_post
