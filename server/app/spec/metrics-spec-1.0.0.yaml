- id: agri_loan
  institution: bank
  name: Agricultural lending
  product_types:
  - id: crop_loan
    typical_products: seasonal crop-production loans and farmer credit cards (e.g. India's Kisan Credit Card), repaid
      after harvest
    islamic_variant: salam and murabaha crop finance
  - id: agri_term_loan
    typical_products: farm equipment, irrigation, livestock and plantation loans
    islamic_variant: ijarah and diminishing musharakah for equipment
  - id: agri_value_chain
    typical_products: warehouse-receipt and value-chain finance to farmers and aggregators
    islamic_variant: salam with parallel salam
  supervisory_note: Agricultural lending is reported to supervisors in priority-sector or sectoral credit returns
    in most South Asian and African markets; disbursement and outstanding figures are cheap. Due-date collection
    rates need new aggregation.
  derived_metrics: []
  metrics:
  - key: disbursements
    name: Agricultural disbursements
    question: Are farmers borrowing less for the season (prices, a drought, a policy change)?
    definition:
      includes:
      - new loans and drawdowns on seasonal limits paid out to farmers and agricultural businesses
      excludes:
      - renewals of a limit without new funds
      - restructures and rollovers
      - interest capitalised
      booking_date: value date, as a local date in the profile's time zone; a value date on a non-business day is
        reported on the next business day
      flow_basis: gross; values are positive
    kind: flow
    unit: currency
    currency_rule: base
    grain: weekly
    day_basis: null
    max_lag_days: 2
    max_lag_rule: null
    history_months: 39
    breakdowns:
    - crop_group
    - size_band
    - region_l1
    - region_l2
    volume: borrowers receiving a disbursement
    adverse:
    - fall
    tier: required
    starter: false
    themes:
    - commodities
    - regulation
    - disaster
    - prices
    - rates
    applies_to: all
    scope: product
    extras:
    - count
    commonly_reported: true
    validation:
      method: seasonal_ratio
      judge_grain: null
      stable_age_days: 7
      min_volume: 50
      min_denominator: null
      min_base: 20
      counts: false
      mask_family: false
