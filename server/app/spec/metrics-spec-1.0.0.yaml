- id: retail_loan
  institution: bank
  name: Retail lending
  product_types:
  - id: personal_loan
    typical_products: unsecured personal instalment loans
    islamic_variant: tawarruq or commodity-murabaha personal finance
  - id: housing_loan
    typical_products: mortgages and home-equity loans
    islamic_variant: murabaha, ijarah or diminishing-musharakah home finance
  - id: education_loan
    typical_products: student and education loans
    islamic_variant: qard or murabaha education finance
  - id: other_secured_consumer
    typical_products: loans against deposits, securities or insurance policies
    islamic_variant: financing secured on investment accounts
  - id: personal_overdraft
    typical_products: personal overdrafts and unsecured credit lines (credit cards excluded)
    islamic_variant: tawarruq-based credit lines
  supervisory_note: Outstanding, dpd buckets, IFRS 9 stages, write-offs and restructures are reported to supervisors
    almost everywhere. Weekly collection rates, roll rates and request counts need new aggregation from the collections
    and loan systems.
  derived_metrics: []
  metrics:
  - key: installment_collection_rate
    name: Instalment collection rate
    question: Are borrowers paying this period's instalments on time (the earliest sign of stress)?
    definition:
      includes: []
      excludes:
      - payments of earlier arrears beyond what the instalment needs
      - prepayments of future instalments
      - instalments deferred by a moratorium (excluded from both sides)
      - late-payment charges, including amounts paid to charity under Islamic late-payment undertakings
      booking_date: instalment due date (a due-date cohort); payments by value date, local; foreign-currency instalments
        converted at the due date's reference rate
      numerator: amounts received by the end of the 3rd business day after each instalment's due date (in the record's
        own calendar), so weekend and holiday due dates get the same time to clear as weekday ones, against instalments
        due in the period (partial payments count by amount; a payment is applied to the period's instalment before
        older arrears)
      denominator: scheduled instalments (principal plus interest or profit; ijara rentals) due in the period on
        loans not written off
    kind: ratio
    unit: percent
    currency_rule: base
    grain: weekly
    day_basis: null
    max_lag_days: 7
    max_lag_rule: null
    history_months: 27
    breakdowns:
    - segment
    - employer_sector
    - rate_type
    - region_l1
    - region_l2
    volume: loans with an instalment due in the period
    adverse:
    - fall
    tier: required
    starter: false
    themes:
    - rates
    - prices
    - sector
    - remittance
    - macro
    - disaster
