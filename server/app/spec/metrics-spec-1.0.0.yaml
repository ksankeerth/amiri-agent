      - 'for murabaha working-capital programmes: the approved programme limit and the outstanding receivables net
        of unearned profit'
      excludes:
      - trade-finance lines (see trade_finance)
      - lines opened after the segment date, for periods after it
      booking_date: position at the end of the period's last business day
      numerator: drawn balances at the period's end on the lines in the denominator
      denominator: approved limits of working-capital lines, held at their level on the earlier of the period's
