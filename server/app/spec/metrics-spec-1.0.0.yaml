aliases: []
deprecations: []
alias_rules:
  shape: '{old: {category, key, filter}, new: {category, key, filter}, context: bool, since}; also used for renamed
    dimensions and dimension values'
  filter_merge: an alias's filter is added to the request's filter; a request that sets the same dimension to a
    different value is rejected with alias_filter_conflict
  lifetime: aliases resolve for the whole MAJOR line
break_kinds:
  lasting:
    system_migration: a core, card, policy or claims system change that alters how or when records are posted
    product_change: a product launched, withdrawn, repriced structurally, or its terms changed
    rule_change: a regulatory, accounting or tax rule that changes what is recorded (a new dpd counting rule, IFRS
      9 or IFRS 17 adoption, a change of weekend)
    portfolio_transfer: a book bought, sold, merged or moved between products or entities
    large_scheme_change: a group scheme, fleet, payroll or corporate relationship larger than 5% of a metric's exposure
      or volume joining or leaving
    classification_change: a change in how customers, sectors or regions are classified (including branch mergers
      and ISO 3166-2 code changes)
    definition_change: the institution changed how it computes a spec metric (e.g. a new transaction-code list)
    currency_redenomination: the base currency was redenominated (e.g. SLL to SLE in 2022, at 1,000 to 1); history
      is restated at the legal factor and the break records the date and factor
  episode:
    relief: a payment moratorium, deferral, premium-grace extension or fee waiver, with its end date; `relief_kind`
      says which
    disaster: a flood, storm, earthquake, epidemic or conflict that disrupted operations or customers
    outage: a system or network outage that disrupted transactions
    campaign: a one-off promotion large enough to move a metric (recurring campaigns go in the calendar as flags)
    market_disruption: a market closure, bank holiday declared at short notice, or capital-control episode
reference_data:
  supplied_by: the checking system, not the institution
  series:
    fx_reference_rates: the declared sources' daily reference rates
    cpi: the national consumer price index, monthly, for real-terms checks in high-inflation regimes
    gold_price: LBMA gold price × the base-currency rate, or a declared local reference price per gram and fineness
    rival_rates: rivals' publicly advertised rates by product and tenor, weekly, with special schemes flagged
    materials_cost_index: building-materials prices (cement, steel, roofing), monthly, from public statistics
    system_returned_cheque_rate: clearing-house or central-bank system-wide return rate, where published
    public_calendars: official holiday calendars, for institutions that don't serve /calendar
conformance_checks:
- id: C01
  level: L1
  name: Profile complete
  check: GET /catalog returns spec_version, time_zone (a valid IANA name), business_calendars (a primary one, and
    one per region with its own holidays or weekend), base_currency and pivot_currency (ISO 4217), fx_reference_sources,
    region_basis, accounting_framework with the dpd fields, suppression rule and capability_level.
  passes: Every field present and valid.
  fix: Fill the profile; use IANA names such as Asia/Dubai, never offsets like +04:00; declare a calendar for every
    region whose holidays or weekend differ.
- id: C02
  level: L1
  name: Products mapped
  check: Every product in the catalog names a category and product type from this spec; every metric key is a spec
    key or an alias, offered only for categories that define it.
  passes: No unknown category, product type or metric key.
  fix: Map the product to the nearest type, or report it as unmapped; rename keys or declare the mapping in the
    connector.
- id: C03
  level: L1
  name: Grid periods
  check: 'Rows for daily, weekly and monthly requests: from < until, until exclusive, weeks start on Monday, months
    on the 1st, business-day rows only on business days of the calendar that applies (the region''s, or the primary
    calendar for multi-region totals); no gaps or overlaps.'
  passes: Every row sits on the grid.
  fix: Compute periods in the profile's time zone with until exclusive; never return partial periods.
- id: C04
  level: L1
  name: No relative, off-grid or over-filtered requests
  check: A request whose start or until is off the metric's grid, that names a relative window, that filters on
    more than 3 dimensions, or whose segment_as_of is not a Monday, is rejected with the matching error code; the
    current, still-open period is never returned.
  passes: 400 off_grid, too_many_filters or segment_date_not_on_grid; no row for an open period.
  fix: Validate dates and filters before querying; drop 'last N days' and 'month to date' parameters.
- id: C05
  level: L1
  name: Units and currency
  check: unit matches the spec; currency is an ISO 4217 code; currency_basis=original returns metrics whose rule
    is `original` in the currency the customer paid or was paid in, and base returns the same totals converted at
    transaction-date rates.
  passes: Units equal the spec; original and base differ only by the conversion.
  fix: 'Store the original amount and currency per transaction (for remittances: the sender''s instructed currency);
    convert at the declared reference rate of the transaction''s date, not the period end.'
- id: C06
  level: L2
  name: Ratio and rate arithmetic
  check: For ratios, value = numerator ÷ denominator × 100; for rates, value = numerator ÷ exposure × 1,000; within
    0.01 of the unit.
  passes: All rows agree.
  fix: Return the numerator and denominator the value was computed from, not separately rounded figures.
- id: C07
  level: L2
  name: Additivity
  check: 'For flows and counts: the sum over a breakdown''s values (including unknown) equals the unfiltered total,
    allowing for suppressed cells; daily rows summed over a week equal the weekly total the institution would compute.'
  passes: Differences only where cells are suppressed.
  fix: Use one set of inclusion rules and one booking date for every grain and breakdown; send records without the
    attribute to `unknown` instead of dropping them.
- id: C08
  level: L2
  name: Stock consistency
  check: A weekly or monthly stock equals the daily stock on the period's last business day.
  passes: Equal.
  fix: Read stocks from the end-of-day snapshot of the last business day.
- id: C09
  level: L2
  name: Suppression
  check: No unsuppressed row has fewer distinct contributors than the minimum, breaks the (1, 50%) or (2, 85%) dominance
    rule on its measured component, or serves a median from fewer than 20 contributors; suppressed rows return null
    value, numerator, denominator, exposure and volume.
  passes: No row breaks the rule.
  fix: Apply suppression to every returned aggregate, after filtering, on the requested period, counting customers
    rather than accounts.
- id: C10
  level: L2
  name: Complementary suppression over served combinations
  check: 'For a sample of suppressed cells, the connector tries to rebuild each one from published cells: parent
    total minus siblings, across every filter combination the catalog serves (up to 3 dimensions).'
  passes: No suppressed cell can be rebuilt.
  fix: Run secondary suppression over the full set of served combinations (or restrict them with filter_sets).
- id: C11
  level: L3
  name: History depth
  check: Each metric's earliest row is at least history_months before the latest closed period (39 for seasonal,
    recent-vs-prior and trend tests, 27 for level tests), or at the product's declared launch date.
  passes: Deep enough, or launch declared.
  fix: 'Back-fill from the system of record, flagging the rows backfilled: true; declare launch dates and any system
    migration as a break.'
- id: C12
  level: L3
  name: Publication
  check: Every live (not back-filled) row has published_at; in the last 12 live months, at least 95% of periods
    were published within max_lag_days of their last day.
  passes: Present and on time.
  fix: Record the local date each period's value was first produced; if your lag is longer, declare it in the catalog
    (the checks then wait longer).
- id: C13
  level: L3
  name: Breaks declared
  check: GET /breaks returns valid rows (kind, type, date, until for episodes, scope); system migrations, relief
    periods, large scheme or fleet changes and currency redenominations of the last 39 months are present; descriptions
    name no customer.
  passes: Valid, and none known to be missing.
  fix: Declare past migrations, product changes, relief schemes and large portfolio moves; lasting shifts have no
    until.
- id: C14
  level: L4
  name: Vintages
  check: 'For a period known to have been revised: known_through before its first publication returns it as unpublished;
    between publication and revision returns the first value; same_age_days returns the value as known that many
    days after the period ended; rows say vintage, revised and revision_held.'
  passes: All behave as described.
  fix: Keep every published value with the date it was produced, or reconstruct vintages from posting timestamps
    (entries posted by the date, with value dates in the period).
- id: C15
  level: L2
  name: Frozen segments and the cohort rule
  check: A request with segment_as_of returns customer attributes as they were on that date; customers who left
    before it keep the attribute of their last day; customers who joined after it take their attribute at onboarding;
    facility limits are held at the earlier of the period's start and the segment date.
  passes: All four hold on test customers.
  fix: Keep dated history of customer attributes, or weekly snapshots; declare the snapshot frequency in the catalog.
- id: C16
  level: L5
  name: Change concentration
  check: GET /change-concentration rejects overlapping, unequal or off-grid windows (windows_invalid) and returns
    only a band of the top share, never a change value, identifier, rank or amount.
  passes: Invalid windows rejected; a band only.
  fix: Compute per-contributor changes inside your systems and return only the band.
- id: C17
  level: L1
  name: Calendars
  check: Business days, holidays and standard flags (weekend, holidays, salary_day, month_end, season:<name>, dst_change)
    are available for every declared calendar, from the start of history to 12 months ahead, with moving holidays
    dated.
  passes: Complete, per calendar, with named holidays and seasons.
  fix: Serve /calendar per calendar_id, or declare the public calendars and their sources in the profile.
- id: C18
  level: L1
  name: Limits and speed
  check: A request for a metric's full history (in pages if needed) completes within 30 seconds; 429 and 503 responses
    carry Retry-After; a page token keeps the known_through of the first page.
  passes: Within limits; pages consistent.
  fix: Pre-aggregate per period and breakdown; page by period; pin the vintage in the token.
- id: C19
  level: L1
  name: No personal data
  check: No response (series, breaks, catalog notes) contains fields or values that look like account, card or policy
    numbers, names, national identifiers, or single-customer amounts; dimension values are from the spec or the
    mapped lists.
  passes: Nothing flagged.
  fix: Remove the field or text; replace identifiers by spec dimension values.
- id: C20
  level: L1
  name: Spec-version header and aliases
  check: Every response carries Metrics-Spec-Version with a version this spec accepts (same MAJOR); the catalog
    lists the aliases and deprecations the server honours; an alias whose filter conflicts with the request's filter
    returns alias_filter_conflict.
  passes: Header present; aliases listed and enforced.
  fix: Add the header from configuration; serve the spec's alias table.
- id: C21
  level: L2
  name: Booking-date self-test (institution only)
  check: 'Post test transactions: one at 23:30 local time, one on a regional holiday, one reversed two days later,
    one own-account transfer, one joint-account transfer from a co-holder, one instalment due on a Sunday and paid
    on Monday.'
  passes: 23:30 in that local day; regional-holiday flow on the region's next business day; reversal netted to the
    original date; own-account and co-holder transfers excluded; the Sunday instalment counted as collected.
  fix: Use local dates of the value date; apply each region's calendar; net reversals to the original date; treat
    joint accounts as the co-holders' own accounts; measure collections with the clearing days of R4.
- id: C22
  level: L4
  name: Revision and segment-date guards
  check: 'A revision resting on fewer than min_contributors contributors is held (revision_held: true) until it
    passes or reaches the stable age; a segment_as_of whose membership difference from the previous Monday is between
    1 and min_contributors - 1 is refused for that cell.'
  passes: Both guards fire on test data.
  fix: Compare each new vintage and each segment date with the last served one before releasing it.
