    frozen: false
    description: Whether the premium is subsidised under a public scheme.
capability_levels:
- level: L1
  name: Values
  requires: One value per closed grid period, with unit and currency; suppression applied (R1); the profile declared
    (time zone, calendars, base currency, spec version).
  unlocks: Charts and levels shown as context next to an event brief.
  lost_without: Nothing can be shown from your data.
- level: L2
  name: Checkable values
  requires: L1, plus numerator and denominator for ratios, exposure for rates, and volume on every unsuppressed
    row; breakdowns as listed for the metric; segment_as_of honoured (R4 cohort rule).
  unlocks: Verdicts. Minimum-volume and small-denominator protections, rates that don't drift with book growth,
    filtered (segment, region) checks.
  lost_without: The checks can't tell whether a move rests on enough records, so they give no verdict on the metric.
    You get context only.
- level: L3
  name: Timed and deep
  requires: 'L2, plus published_at on every live row (back-filled rows say backfilled: true instead), the history
    the metric''s test needs (history_months: 39 for seasonal, recent-vs-prior and trend tests, 27 for level tests),
    and breaks declared.'
  unlocks: Seasonal tests with a full 24-month distribution; verdicts as soon as a period is published; honest handling
    of migrations and relief periods.
  lost_without: The checks assume each period is published only at its maximum lag, so verdicts arrive later. With
    short history, seasonal tests fall back to a weaker statistical test or give no verdict. Without breaks, a migration
    or a relief period can be read as customer behaviour.
- level: L4
  name: Vintages
  requires: L3, plus values as known through a date (known_through) and at a given age after the period ended (same_age_days);
    each row labels its vintage and whether it was revised. Past vintages may be reconstructed from posting timestamps
    (R3); the catalog states vintage_history_from.
  unlocks: Comparisons at the same age (young claims or late-posted repayments don't bias the verdict), final verdicts
    as soon as the watch is published, and revision checks that supersede a verdict when numbers change.
  lost_without: No revision checks. Verdicts stay provisional until the newest watch period has passed the metric's
    stable age, so a final answer can take 7 to 120 days longer.
- level: L5
  name: Change concentration
  requires: 'L4, plus GET /change-concentration: for two disjoint, equal-length windows, a band for the largest
    single contributor''s share of the change, never its value or identity.'
  unlocks: 'Dominance checks on the move itself: a verdict is never built on one obligor''s drawdown or one merchant''s
    collapse.'
  lost_without: For metrics marked concentration_sensitive the checks give no verdict, because one customer could
    be driving the move; for others they proceed and note that dominance was not checked.
categories:
- id: savings
  institution: bank
  name: Deposits and accounts
  product_types:
  - id: current_account
    typical_products: current and checking accounts, including business current accounts
    islamic_variant: qard or wadiah current accounts
  - id: savings_account
    typical_products: passbook and online savings; youth, child, senior and migrant-worker savings
    islamic_variant: wadiah or mudarabah savings accounts
  - id: term_deposit
    typical_products: fixed and time deposits, retail certificates of deposit
    islamic_variant: mudarabah or wakala term investment accounts, commodity murabaha deposits
  - id: fc_deposit
    typical_products: resident and non-resident foreign-currency accounts (e.g. NRFC and PFCA in Sri Lanka, FCNR(B)
      in India, domiciliary accounts in Nigeria and Ghana, USD accounts in Latin America)
    islamic_variant: foreign-currency wadiah or mudarabah accounts
  supervisory_note: Balances by product, currency and region are reported to supervisors almost everywhere (deposit
    returns, deposit-insurance returns); remittance inflows go to central banks for the balance of payments. Daily
    flows, segments, non-renewal and closures need new aggregation, but from transaction codes the core already
    holds.
  derived_metrics:
  - key: net_deposits
    formula: deposit_inflow − withdrawals
    note: judged as a % of the baseline's gross deposit_inflow, never as a % of itself; method recent_vs_prior or
      seasonal_ratio; adverse fall
  metrics:
  - key: deposit_inflow
    name: Deposit inflow
    question: Is money coming into these accounts faster or slower than normal for this time of year?
    definition:
      includes:
      - cash deposits
      - incoming transfers from other institutions and from other customers of this institution
      - salary and pension credits
      - inward remittances credited to the account
      - cheques credited on clearing
      excludes:
      - interest or profit credited
      - transfers between two accounts of the same customer at this institution
      - loan or financing disbursements
      - term-deposit maturities credited back
      - postings to the institution's own, internal, suspense and nostro accounts
      - products offered only to staff, such as staff loans and staff savings schemes (staff members' ordinary accounts
        stay in)
      - refunds of fees
      booking_date: value date, as a local date in the profile's time zone; a value date on a non-business day is
        reported on the next business day
      flow_basis: gross; values are positive
      notes: 'Reversals and corrections are netted against the original transaction''s booking date, so they revise
        that period (served as a new vintage). Joint accounts: transfers between accounts the same customer holds
        alone or jointly are own-account transfers. For a foreign-currency product the value is in its original
        currency; a multi-currency account is split by currency, each part treated as a foreign-currency product
        unless it is the base currency. segment=government carries the commodity channel for commodity-exporting
        economies.'
    kind: flow
    unit: currency
    currency_rule: product
    grain: daily
    day_basis: business
    max_lag_days: 1
    max_lag_rule: null
    history_months: 39
    breakdowns:
    - segment
    - employer_sector
    - age_band
    - region_l1
    - region_l2
    - channel
    - currency
    volume: accounts with at least one included credit in the period
    adverse:
    - fall
    tier: required
    starter: true
    themes:
    - rates
    - trust
    - competitor
    - remittance
    - macro
    - sector
    - disaster
    - commodities
    applies_to:
    - current_account
    - savings_account
    - fc_deposit
    scope: product
    extras: []
    commonly_reported: false
    validation:
      method: recent_vs_prior
      judge_grain: null
      stable_age_days: 7
      min_volume: 30
      min_denominator: null
      min_base: null
      counts: false
      mask_family: false
      masked_by: null
      adverse_allowed:
      - fall
      concentration_sensitive: false
      thresholds:
        small:
          robust_z: 3
          pct_change: 15
        medium:
          robust_z: 3
          pct_change: 15
        large:
          robust_z: 3
          pct_change: 15
