- id: cards
  institution: bank
  name: Cards
  product_types:
  - id: credit_card
    typical_products: revolving credit cards
    islamic_variant: ujrah- or tawarruq-based credit cards
  - id: charge_card
    typical_products: cards repaid in full each cycle
    islamic_variant: null
  - id: debit_card
    typical_products: cards on current or savings accounts
    islamic_variant: null
  - id: prepaid_card
    typical_products: prepaid and gift cards issued by the bank
    islamic_variant: null
  supervisory_note: Card counts, spend and receivables are reported to central banks' payment statistics in most
    countries. Payment and revolving rates need new aggregation from the card system's statement data.
  derived_metrics: []
  metrics:
  - key: card_spend
    name: Domestic card spend
    question: Are cardholders spending less at home?
    definition:
      includes:
      - purchases at merchants in the profile's country (point of sale, contactless, domestic e-commerce, card-based
        QR) that settled
      excludes:
      - purchases abroad or at foreign e-commerce merchants (see card_spend_cross_border)
      - cash withdrawals and cash advances
      - refunds and chargebacks (purchases are gross)
      - authorisations that never settled
      - fees, interest, balance transfers, quasi-cash (MCC 4829, 6050, 6051, 6540) and card-to-card transfers
      booking_date: authorisation date, as a local date in the profile's time zone (not the settlement date); every
        calendar day is a period
      flow_basis: gross purchases; values are positive
    kind: flow
    unit: currency
    currency_rule: base
    grain: daily
    day_basis: calendar
    max_lag_days: 2
    max_lag_rule: null
    history_months: 39
    breakdowns:
    - merchant_sector
    - region_l1
    volume: cards with at least one purchase in the period
    adverse:
    - fall
    tier: required
    starter: true
    themes:
    - prices
    - macro
    - disaster
    - sector
    - rates
    applies_to: all
    scope: product
    extras: []
    commonly_reported: true
    validation:
      method: seasonal_ratio
      judge_grain: null
      stable_age_days: 7
      min_volume: 500
      min_denominator: null
      min_base: 100
      counts: false
      mask_family: false
      masked_by: null
      adverse_allowed:
      - fall
      concentration_sensitive: false
      thresholds:
        small:
          percentile: 5
          pct_change: 5
        medium:
          percentile: 5
          pct_change: 5
        large:
          percentile: 5
          pct_change: 5
    since: 1.0.0
  - key: card_spend_cross_border
    name: Cross-border card spend
    question: Are cardholders spending less abroad, judged in the currencies they spend in?
    definition:
      includes:
      - purchases at merchants abroad and at foreign e-commerce merchants that settled, in the transaction currency
      excludes:
      - the same exclusions as card_spend
      - dynamic-currency-conversion mark-ups
      booking_date: authorisation date, local
      flow_basis: gross purchases; values are positive
      notes: Original currency, so a devaluation of the base currency doesn't raise it by arithmetic (the move would
