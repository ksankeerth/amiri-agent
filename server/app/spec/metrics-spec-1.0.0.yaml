    since: 1.0.0
  - key: roll_rate_to_30
    name: Roll rate past 30 dpd
    question: Is more of the performing farm book falling more than 30 days behind?
    definition:
      includes:
      - 'days past due: days since the oldest unpaid contractual instalment fell due, above the profile''s declared
        materiality threshold (default none). ''Past 30 dpd'' means more than 30 days (31+), matching IFRS 9''s
        presumption and India''s SMA-1 (31-60). dpd keeps counting through a restructure and resets only when the
        arrears are paid; a local rule that resets dpd on restructure is declared in the profile (dpd_reset_on_restructure)
        and as a rule_change break'
      excludes:
      - loans written off or sold during the month
      booking_date: month-end snapshots
