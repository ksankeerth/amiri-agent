# Metrics Spec v1.0: machine-readable form of metrics-spec-v1.0.md.
# The guide and this file carry the same content; edit both together.
spec_version: 1.0.0
validation_params_version: 1.0.0
title: Metrics Spec
status: release for implementation feedback
published: '2026-10-11'
guide: metrics-spec-v1.0.md
reference_api: metrics-spec-v1.0-openapi.yaml
scope:
  institutions:
  - bank (commercial, retail, savings, specialised, Islamic)
  - insurer (life, general, health, takaful)
  out_of_scope:
  - finance companies
  - microfinance institutions
  - brokers
  - asset managers
  - payment-only firms
rules:
  aggregates_only:
    min_contributors: 10
    dominance:
      one: 0.5
      two: 0.85
    stricter_local_rule_wins: true
    max_filter_dims: 3
    suppression:
      contributors: Suppression counts distinct contributors (customers, obligors, policyholders, merchants), not
        accounts or transactions. A cell needs at least min_contributors contributors (default 10).
      dominance: A cell is suppressed when one contributor holds more than 50% of the measured component, or the
        two largest together hold more than 85% (the (1, 50%) and (2, 85%) dominance rules). A stricter local rule
        wins.
      measured_component:
        flow, count, stock: the value
        net flow: each gross side (credits and debits) separately
        ratio: 'the denominator, and the numerator when it is above zero; if only the numerator is dominated, value
          and numerator are suppressed and the row says suppression_reason: numerator_dominance'
        rate: the numerator (events) and the exposure
        level (index, median): medians are served only with at least 20 contributors, as the mean of the 4 central
          values, rounded to 2 significant figures; indices only from at least 20 priced items
      filters: 'A request filters on at most 3 dimensions. The catalog may restrict the combinations it serves (filter_sets).
        Complementary suppression is computed over every combination the institution serves: no suppressed cell
        may be derivable from published cells by addition or subtraction.'
      vintages: 'A revision is released only when the change from the last released vintage, taken as its own aggregate,
        passes the contributor and dominance rules; until then the earlier value stays served with revision_held:
        true. Held revisions are released, accumulated, once they pass or when the period reaches its stable age.'
      segment_dates: 'segment_as_of must be a Monday (an ISO-week start). A segment_as_of is refused for a cell
        (suppression_reason: segment_difference) when the number of customers whose membership differs from the
        previous Monday''s is between 1 and min_contributors - 1.'
      change_concentration: Windows a and b are disjoint, each a whole number of grid periods, of equal length,
        with b after a. The response gives only a band of the top share; no change value. Both windows need at least
        min_contributors contributors.
      free_text: Break descriptions, notes and declarations never name customers, employers or obligors.
      audit: Every query is logged. The institution reviews repeated near-identical queries (differencing patterns).
  absolute_time:
    periods: '[from, until), until exclusive, local dates in the profile''s time zone'
    grids:
    - daily
    - weekly
    - monthly
    - quarterly
    relative_windows: never
    segment_as_of: a Monday
    known_through: a local date, inclusive
  every_value_carries:
  - value
  - unit
  - currency
  - numerator
  - denominator
  - exposure
  - volume
  - suppressed
  - suppression_reason
  - published_at
  - backfilled
  - data_as_of
  - vintage
  - revised
  - revision_held
  regions: ISO 3166-1 / ISO 3166-2; lower levels mapped at onboarding; a calendar per region where holidays or weekends
    differ
  sectors: ISIC Rev.4 sections and divisions, or mapped to them
  accounting: IFRS 9 / IFRS 17 concepts; AAOIFI, CECL and local equivalents mapped
  currency:
    conversion: each transaction at its own date's declared reference rate
    original: the currency the customer paid or was paid in
    redenomination: history restated at the legal factor; declared as a currency_redenomination break
    high_inflation: 'the profile declares inflation_regime: high; the checks then judge base-currency amounts in
      real terms, using a CPI reference series'
    multiple_official_rates: fx_reference_sources names the rate per use (e.g. official for trade, parallel-market
      for remittances)
  collections: 'collection rates are due-date cohorts: receipts by the end of the 3rd business day after each due
    date'
  dpd: more than 30 days means 31+; dpd keeps counting through a restructure; materiality declared
  insurance_counts: exposure and claims count risks (locations, vehicles, lives); one claim per risk per loss event
institution_profile:
  institution_type:
    required: true
    values:
    - bank
    - insurer
    note: one profile per reporting entity and country
  legal_entity_name:
    required: true
  lei:
    required: false
    format: ISO 17442 Legal Entity Identifier of the institution itself
  country:
    required: true
    format: ISO 3166-1 alpha-2
  spec_version:
    required: true
    format: MAJOR.MINOR.PATCH implemented, e.g. 1.0.0
  time_zone:
    required: true
    format: IANA tz name
    example: Asia/Riyadh
  business_calendars:
    required: true
    fields:
      id: calendar id
      primary: true for exactly one calendar
      weekend_days: ISO weekday numbers, e.g. [6, 7] or [5, 6]
      regions: region_l1 values it applies to (empty for the primary)
      source: served (GET /calendar?calendar_id=) or a named public calendar with URL
  base_currency:
    required: true
    format: ISO 4217
  base_currency_history:
    required: false
    note: earlier base currencies with the redenomination date and factor
  pivot_currency:
    required: true
    format: ISO 4217
    default: USD
  fx_reference_sources:
    required: true
    fields:
      use: default | trade | remittance | card | ...
      name: source
      rate_type: mid
      fixing_time: local time
  inflation_regime:
    required: true
    values:
    - normal
    - high
    note: high when the economy is hyperinflationary under IAS 29, or annual CPI inflation is above 25%
  region_basis:
    required: true
    values:
    - home_branch
    - customer_domicile
    applies_to: bank
    note: customer_domicile for institutions without branches; insurers always use risk location
  region_levels:
    required: true
    fields:
      l1: iso_3166_2
      l2: iso_3166_2 | mapped
  sector_classification:
    required: true
    default: ISIC Rev.4
    note: or a classification mapped to it
  accounting_framework:
    required: true
    fields:
      framework: IFRS 9 | IFRS 17 | AAOIFI | US GAAP (CECL) | local GAAP
      dpd_materiality: amount and/or percent below which arrears don't count (default none)
      dpd_reset_on_restructure: false, or true where a local rule forces it (also a rule_change break)
      dpd_note: how local arrears buckets map to days past due
  suppression:
    required: true
    fields:
      min_contributors: 10
      dominance_one: 0.5
      dominance_two: 0.85
      local_rule: text, if stricter
  renewal_grace_days:
    required: false
    default: 30
    applies_to: insurer
  free_look_days:
    required: false
    default: 30
    applies_to: insurer
  capability_level:
    required: true
    values:
    - L1
    - L2
    - L3
    - L4
    - L5
    note: the lowest level across required metrics; metrics may declare their own
  vintages_kept:
    required: true
    type: boolean
  vintage_history_from:
    required: false
    format: date
    note: first date with true or reconstructed vintages
  segment_snapshot:
    required: false
    values:
    - dated_history
    - weekly_snapshot
    - static
  shariah_compliant:
    required: false
    type: boolean
vocabularies:
  themes:
    fx: exchange-rate moves of the base currency
    rates: 'policy, market or administered interest/profit-rate changes '
    prices: 'consumer, fuel, food, energy or utility price changes '
    commodities: 'commodity prices that act on a product directly: gold, crops, oil as cargo'
    remittance: 'changes in cross-border personal remittances '
    regulation: 'taxes, central-bank or supervisor directions, relief schemes, import controls, tariffs '
    competitor: a rival's pricing, new product, failure or partner switch
    macro: 'growth, employment, recession or recovery news '
    sector: 'a shock or boost to one economic sector '
    disaster: 'natural or man-made disasters and epidemics, at home or abroad '
    trust: 'news that could shake confidence in this institution, a rival or the system '
    markets: 'equity and bond market moves '
  kinds:
    flow: a total over the period. Each flow says whether it is gross or net and its sign. Never averaged.
    stock: a level at the end of the period's last business day. Never summed over periods.
    count: the number of events in the period.
    ratio: numerator ÷ denominator × 100, both returned, both measured over the same records.
    rate: events ÷ exposure × 1,000 for the period (not annualised); numerator and exposure both returned.
    level: a price, index or rate observed at a date or over a declared window; neither summed nor divided.
  units:
    currency: an amount of money; the row's `currency` field gives the ISO 4217 code
    count: a whole number of events or records
    percent: a ratio × 100 (0-100)
    per_1000: events per 1,000 units of exposure
    index: an index equal to 100 in the declared base period
    percent_pa: an annual interest or profit rate, in percent
    pp: a difference of two percentages, in percentage points
  currency_rules:
    base: converted to the profile's base currency at each transaction's own date, using the declared reference
      rate; base-currency transactions are not converted
    product: 'the product''s own currency: base-currency products in the base currency; a foreign-currency product
      in its original currency (see `original`)'
    original: in the currency the customer paid or was paid in (for remittances, the sender's instructed currency).
      With a `currency` filter the value is in that currency; without one, every currency is converted to the profile's
      pivot currency at each transaction's own date. Never judged in the base currency
    none: not an amount of money
  grains:
    daily: one row per day; `day_basis` says business days (per the declared calendar) or calendar days
    weekly: ISO weeks, Monday 00:00 to the next Monday 00:00 local time
    monthly: calendar months, from the 1st to the 1st of the next month
    quarterly: calendar quarters; context only, never tested
  methods:
    recent_vs_prior: the watch span vs 8 aligned prior spans, each adjusted by the mean of the last two years' ratio
      for the same window; robust z (median/MAD) and minimum change
    seasonal_ratio: watch ÷ (aligned span a year earlier × growth), judged against the distribution of the same
      ratio over rolling aligned spans in the prior 24 months, and a minimum change
    level_change: the level at the watch's end vs the anchor, at the same position in the month or cycle, judged
      against the same-position change distribution and a minimum change
    trend: the mean gap between the watch months and the 12-month trend before the anchor, projected forward
    context: shown next to verdicts; never tested
    mask: 'the mask metric: a rise beyond its limit masks the credit-quality family'
    book_size: used to rank products; never tested
  tiers:
    required: needed for a category to count as covered; cheap, and mostly already reported in some form
    recommended: sharpens or adds checks; expected within the first months
    optional: useful context or niche checks
  calendar_flags:
    weekend: a weekend day of this calendar
    public_holiday: a holiday in this calendar (holidays[] names it)
    regional_holiday: a holiday only in some regions; those regions' own calendars carry it as a public_holiday
    moving_holiday: a holiday whose date moves year to year (lunar or lunisolar calendars, Easter)
    partial: a business day with shortened hours
    after_holiday: the first business day after one or more non-business days
    salary_day: a day when the main payroll credits land (e.g. the 25th, the 27th, the last business day, or a local-calendar
      month start)
    pension_day: a day when public pensions are credited
    month_end: the last business day of the month
    quarter_end: the last business day of the quarter
    season:<name>: 'a day inside a multi-day season that changes behaviour: season:ramadan, season:lunar_new_year,
      season:diwali, season:harvest_<crop>, season:school_fees, season:pilgrimage'
    campaign:<name>: a day inside a recurring campaign (one-off campaigns are declared as breaks)
    dst_change: a day of 23 or 25 hours (daylight-saving change)
  error_codes:
    off_grid: 400
    relative_window: 400
    range_too_large: 400
    invalid_parameter: 400
    too_many_filters: 400
    segment_date_not_on_grid: 400
    windows_invalid: 400
    alias_filter_conflict: 400
    known_through_in_future: 400
    unsupported_version: 400
    unauthorized: 401
    forbidden: 403
    unknown_product: 404
    unknown_metric: 404
    unknown_breakdown: 422
    value_not_allowed: 422
    filter_set_not_allowed: 422
    unsupported_capability: 422
    rate_limited: 429
    internal: 500
    not_implemented: 501
    unavailable: 503
dimensions:
  region_l1:
    values: ISO 3166-2 first-level subdivision codes of the profile's country, plus unknown
    source: ISO 3166-2
    frozen: true
    description: 'First-level region (state, province, emirate, region). Banks: the account''s home branch, or the
      customer''s domicile if the profile declares `region_basis: customer_domicile` (required for institutions
      without branches). Customer-level metrics such as digital_transactions use the customer''s region on the same
      basis. Insurers: the risk location (each insured location, the vehicle''s registered address, the insured
      person''s address). Each value names the business calendar that applies to it. Examples: LK-1, IN-MH, AE-DU,
      SA-01, DE-BY, BR-SP, MX-CMX.'
  region_l2:
    values: ISO 3166-2 second-level codes where the standard has them (e.g. LK-11), otherwise institution_defined
      and mapped at onboarding to the national statistics office's code, plus unknown
    source: ISO 3166-2, or the national statistics office's area codes
    frozen: true
    description: Second-level region (district, county, department, municipality). Every value names its region_l1
      parent. Same basis as region_l1.
  corridor:
    values: ISO 3166-1 alpha-2 codes, plus unknown
    source: ISO 3166-1
    frozen: false
    description: 'The other country in a cross-border flow: the sending country for inward remittances, the receiving
      country for outward ones, the foreign origin or destination for trade and cargo. Taken from the payment or
      shipment record, not the customer.'
  destination_region:
    values: UN M49 sub-region codes (e.g. 145 Western Asia, 035 South-eastern Asia, 154 Northern Europe), plus unknown
    source: UN M49 standard country or area codes
    frozen: false
    description: Where a trip goes (travel insurance). The first destination outside the home country named on the
      policy.
  currency:
    values: ISO 4217 alphabetic codes, plus unknown
    source: ISO 4217
    frozen: false
    description: The original currency of the transaction, account or contract.
  segment:
    values:
    - remittance_linked
    - pensioner
    - student
    - salaried
    - other_individual
    - importer
    - exporter
    - domestic_business
    - government
    - non_bank_financial
    - unknown
    source: this spec; computed from the institution's own transactions and customer type
    frozen: true
    description: 'One value per customer, the first rule that applies, in this order. Individuals: remittance_linked
      (≥1 inward personal remittance credited to any of the customer''s accounts in the 6 months before the segment
      date); pensioner (≥1 pension credit in the 3 months before); student (holds a student product at the segment
      date; a declared occupation alone doesn''t count); salaried (a salary credit, by payroll code or employer
      bulk credit, in at least 2 of the 3 months before); other_individual. Organisations: government (central and
      local government, public agencies and state-owned enterprises, by customer type); non_bank_financial (insurers,
      funds, brokers, finance companies); then businesses by trade payments in the 12 months before: importer (import
      payments > export receipts), exporter (export receipts ≥ import payments > 0, or receipts only), domestic_business
      (neither). Joint accounts take the primary holder''s segment.'
  age_band:
    values:
    - under_18
    - '18_24'
    - '25_34'
    - '35_49'
    - '50_64'
    - 65_plus
    - unknown
    source: this spec
    frozen: true
    description: Age of the individual customer (the primary holder) at the segment date.
  size_band:
    values:
    - startup
    - micro
    - sme
    - corporate
    - unknown
    source: the institution's credit-policy size classification (usually the local regulator's), mapped at onboarding
    frozen: true
    description: 'Business size, first rule that applies: startup (incorporated less than 3 years before the segment
      date), then micro, sme or corporate by the institution''s declared size rule (turnover, employees or exposure).
      Examples of local rules: the EU SME definition (fewer than 250 staff), India''s MSME bands, a central bank''s
      SME lending definition.'
  sector:
    values: ISIC Rev.4 sections A-U, plus unknown
    source: UN ISIC Rev.4; NACE Rev.2 sections are identical; NAICS and national lists are mapped through published
      concordances
    frozen: true
    description: The business customer's main economic activity at the segment date.
  sector_l2:
    values: ISIC Rev.4 divisions (2 digits, 01-99); each names its section as parent, plus unknown
    source: UN ISIC Rev.4 (or mapped to it)
    frozen: true
    description: The same activity at division level, so a shock to one industry (garments = 14, tourism accommodation
      = 55) can be separated from its section.
  employer_sector:
    values: ISIC Rev.4 sections A-U, plus unknown, plus unknown
    source: UN ISIC Rev.4
    frozen: true
    description: ISIC section of the employer that paid the individual's most recent salary credit before the segment
      date (public administration is section O).
  merchant_sector:
    values: ISIC Rev.4 sections A-U, plus unknown
    source: mapped from the merchant category code (ISO 18245) through a table published with the institution's
      catalog
    frozen: false
    description: The merchant's activity, for card spend and acquiring.
  channel:
    values:
    - branch
    - mobile
    - internet
    - atm
    - agent
    - contact_centre
    - api
    - unknown
    source: this spec
    frozen: false
    description: The service channel where the transaction or application was made. `api` covers host-to-host and
      open-banking access; `agent` covers banking agents and correspondents.
  sales_channel:
    values:
    - agency
    - broker
    - bancassurance
    - direct
    - digital
    - partner
    - unknown
    source: this spec
    frozen: false
    description: How an insurance policy (or a bank-distributed policy) was sold. `partner` covers affinity, retail,
      telecom and employer schemes; `direct` is the insurer's own staff and branches; `digital` its own web and
      app sales.
  vehicle_type:
    values:
    - two_wheeler
    - three_wheeler
    - car
    - light_commercial
    - heavy_commercial
    - bus
    - agricultural
    - other
    - unknown
    source: this spec; map local registration classes at onboarding
    frozen: false
    description: Class of the financed or insured vehicle.
  new_used:
    values:
    - new
    - used
    - unknown
    source: this spec
    frozen: false
    description: Whether the vehicle was new (first registration) when financed or first insured.
  cover:
    values:
    - comprehensive
    - third_party_only
    - third_party_fire_theft
    - unknown
    source: this spec
    frozen: false
    description: Motor cover level.
  claim_type:
    values:
      motor:
      - collision
      - third_party
      - theft
      - natural_peril
      - glass_other
      - unknown
      health:
      - inpatient
      - outpatient
      - day_care
      - maternity
      - dental_optical
      - critical_illness
      - accident
      - unknown
      travel:
      - medical
      - trip_cancellation
      - baggage_delay
      - other
      - unknown
    source: this spec
    frozen: false
    description: What the claim is for; the value set depends on the category. A motor flood claim is claim_type=natural_peril
      with peril=flood.
  peril:
    values:
    - flood
    - storm
    - earthquake
    - fire
    - drought
    - pest_disease
    - other
    - unknown
    source: this spec
    frozen: false
    description: The cause of loss. `storm` covers wind, cyclone, hurricane and typhoon.
  settlement_mode:
    values:
    - cashless
    - reimbursement
    - unknown
    source: this spec
    frozen: false
    description: 'Health claims: billed directly by the provider (cashless) or claimed back by the insured.'
  plan:
    values: institution_defined, plus unknown
    source: the insurer's plan tiers, listed in its catalog
    frozen: false
    description: Health plan or benefit tier.
  traveller_type:
    values:
    - leisure
    - business
    - student
    - migrant_worker
    - pilgrimage
    - other
    - unknown
    source: this spec
    frozen: false
    description: Purpose of travel as recorded on the policy.
  tenor_band:
    values:
    - lt_3m
    - 3m_6m
    - 6m_12m
    - 1y_3y
    - gt_3y
    - unknown
    source: this spec
    frozen: false
    description: Contractual tenor at placement or booking.
  rate_type:
    values:
    - fixed
    - variable
    - hybrid
    - unknown
    source: this spec
    frozen: false
    description: Whether the interest or profit rate is fixed for the life of the contract, resets with a reference
      rate, or is fixed for an initial period and then resets.
  lc_type:
    values:
    - sight
    - usance
    - unknown
    source: this spec
    frozen: false
    description: Letter of credit payable at sight or deferred (usance, acceptance, deferred payment).
  terms:
    values:
    - collection
    - open_account
    - advance
    - unknown
