          percentile: 5
          pct_change: 10
        large:
          percentile: 5
          pct_change: 10
    since: 1.0.0
  - key: installment_collection_rate
    name: Instalment collection rate
    question: Are farmers repaying what falls due after harvest?
    definition:
      includes: []
      excludes:
      - payments of earlier arrears
      - prepayments
      - deferred instalments
      booking_date: instalment due date (a due-date cohort)
      numerator: amounts received by the end of the 3rd business day after each instalment's due date (in the record's
        own calendar), so weekend and holiday due dates get the same time to clear as weekday ones, against instalments
        due in the period
      denominator: scheduled instalments (including bullet repayments) due in the period on loans not written off
      notes: Monthly, because harvest-season due dates bunch; a loan-waiver announcement (regulation) typically
        stops repayments before it takes effect.
    kind: ratio
    unit: percent
    currency_rule: base
    grain: monthly
    day_basis: null
